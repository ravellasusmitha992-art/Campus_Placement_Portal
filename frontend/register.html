<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand">Student Registration</div><a href="login.html">Login</a></header><main class="container"><div class="card form"><h2>Create Student Profile</h2><form id="registerForm" class="form-grid"><div class="field"><label>Roll Number</label><input name="rollNumber" required></div><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><div class="field"><label>Department</label><input name="department" placeholder="Information Technology" required></div><div class="field"><label>Course</label><input name="course" value="B.Tech" required></div><div class="field"><label>Graduation Year</label><input name="graduationYear" type="number" value="2027" required></div><div class="field"><label>10th %</label><input name="tenthPercentage" type="number" step="0.01" required></div><div class="field"><label>12th %</label><input name="twelfthPercentage" type="number" step="0.01" required></div><div class="field"><label>CGPA</label><input name="cgpa" type="number" step="0.01" required></div><div class="field"><label>Backlogs</label><input name="backlogs" type="number" value="0" required></div><div class="field full"><label>Skills</label><textarea name="skills" placeholder="Java, SQL, Spring Boot"></textarea></div><div class="field full"><button class="btn" type="submit">Register</button></div></form></div></main><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
