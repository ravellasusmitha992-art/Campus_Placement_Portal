<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send Notification</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand">Send Notification</div><nav><a href="admin-dashboard.html">Dashboard</a><button class="btn danger" onclick="logout()">Logout</button></nav></header><main class="container"><div class="card form"><h2>Notify Students</h2><div class="field"><label>Send Notification To</label><select id="targetType" onchange="toggleNotificationTarget()"><option value="ALL">All Students</option><option value="INDIVIDUAL">Individual Student</option><option value="BRANCH">Branch / Department</option><option value="SPECIFIC">Specific Students</option><option value="RANGE">Roll Number Range</option></select></div><div id="studentField" class="field" style="display:none"><label>Student Roll Number</label><input id="studentRollNumber" placeholder="STU001"></div><div id="branchField" class="field" style="display:none"><label>Select Branch / Department</label><select id="branch"><option>Computer Science</option><option>Information Technology</option><option>Electronics and Communication Engineering</option><option>Electrical and Electronics Engineering</option><option>Mechanical Engineering</option><option>Civil Engineering</option><option>Artificial Intelligence and Machine Learning</option><option>Data Science</option></select></div><div id="specificField" class="field" style="display:none"><label>Student Roll Numbers (comma-separated)</label><input id="rollNumbers" placeholder="STU001, STU005, STU008"></div><div id="rangeField" class="form-grid" style="display:none"><div class="field"><label>From Roll Number</label><input id="fromRollNumber" placeholder="STU001"></div><div class="field"><label>To Roll Number</label><input id="toRollNumber" placeholder="STU010"></div></div><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Message</label><textarea id="message" required></textarea></div><button class="btn" onclick="sendNotification()">Send Notification</button></div></main><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/notifications.js"></script></body></html>
