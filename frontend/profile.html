<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand">Student Profile</div><nav><a href="student-dashboard.html">Dashboard</a><a href="placements.html">Drives</a><button class="btn danger" onclick="logout()">Logout</button></nav></header><main class="container"><div class="card form"><h2>Academic & Personal Profile</h2><form id="profileForm" class="form-grid"><div class="field"><label>Roll Number</label><input id="rollNumber" name="rollNumber" required></div><div class="field"><label>Name</label><input id="name" name="name" required></div><div class="field"><label>Email</label><input id="email" name="email" type="email" required></div><div class="field"><label>Phone</label><input id="phone" name="phone" required></div><div class="field"><label>Department</label><input id="department" name="department" required></div><div class="field"><label>Course</label><input id="course" name="course" required></div><div class="field"><label>Graduation Year</label><input id="graduationYear" name="graduationYear" type="number"></div><div class="field"><label>10th %</label><input id="tenthPercentage" name="tenthPercentage" type="number" step="0.01"></div><div class="field"><label>12th %</label><input id="twelfthPercentage" name="twelfthPercentage" type="number" step="0.01"></div><div class="field"><label>CGPA</label><input id="cgpa" name="cgpa" type="number" step="0.01"></div><div class="field"><label>Backlogs</label><input id="backlogs" name="backlogs" type="number"></div><div class="field full"><label>Skills</label><textarea id="skills" name="skills"></textarea></div><div class="field full"><button class="btn">Save Profile</button></div></form><hr><h3>Resume PDF</h3><form id="resumeForm"><input type="file" name="file" accept="application/pdf" required><button class="btn" type="submit">Upload Resume</button></form></div></main><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/student.js"></script><script>loadProfile()</script></body></html>
