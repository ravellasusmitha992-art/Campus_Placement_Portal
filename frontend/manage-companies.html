<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Companies</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand">Manage Companies</div><nav><a href="admin-dashboard.html">Dashboard</a><button class="btn danger" onclick="logout()">Logout</button></nav></header><main class="container"><div class="card form"><h2>Add Company</h2><form onsubmit="createCompany(event)" class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Industry</label><input name="industry" required></div><div class="field"><label>Job Role</label><input name="jobRole" required></div><div class="field"><label>Location</label><input name="jobLocation" required></div><div class="field"><label>Package (LPA)</label><input name="salaryPackage" type="number" step="0.1" required></div><div class="field"><label>Website</label><input name="website"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field full"><label>Job Description</label><textarea name="jobDescription"></textarea></div><div class="field full"><label>Required Skills</label><input name="requiredSkills"></div><div class="field full"><button class="btn">Create Company</button></div></form></div><h1>Company Directory</h1><div class="card table-wrap"><table class="table"><thead><tr><th>Company</th><th>Industry</th><th>Role</th><th>Location</th><th>Package</th></tr></thead><tbody id="companiesBody"></tbody></table></div></main><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/admin.js"></script><script src="js/admin-tools.js"></script><script>loadAdminTables()</script></body></html>
