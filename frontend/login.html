<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .password-input-wrapper {
      position: relative;
    }

    .password-input-wrapper input {
      width: 100%;
      padding-right: 52px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transform: translateY(-50%);
      transition: color 150ms ease;
    }

    .password-toggle:hover {
      color: var(--text);
    }

    .password-toggle:active {
      color: var(--primary);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .password-slash {
      display: none;
    }

    .password-toggle[aria-pressed="true"] .password-slash {
      display: block;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Campus Placement Portal</div>
    <a href="index.html">Home</a>
  </header>
  <main class="container">
    <div class="card form">
      <h2>Sign in</h2>
      <p class="muted">Use your student or placement admin account.</p>
      <form id="loginForm">
        <div class="field">
          <label for="role">Role</label>
          <select id="role">
            <option value="student">Student</option>
            <option value="admin">Placement Admin</option>
          </select>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input id="password" type="password" required>
            <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
              aria-controls="password"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <path class="password-slash" d="M3 3 21 21"></path>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn" type="submit">Login</button>
      </form>
      <p class="muted">Demo admin: admin@campus.com / admin123</p>
      <p class="muted">Demo student: rahul@student.com / student123</p>
    </div>
  </main>
  <div id="toast" class="toast"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.querySelector('.password-toggle');

    passwordToggle.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
    });
  </script>
</body>
</html>
