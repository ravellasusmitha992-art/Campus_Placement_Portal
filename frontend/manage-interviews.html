<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Interviews</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand">Manage Interviews</div><nav><a href="admin-dashboard.html">Dashboard</a><button class="btn danger" onclick="logout()">Logout</button></nav></header><main class="container"><div class="card form"><h2>Schedule Interview</h2><form onsubmit="scheduleBulkInterview(event)" class="form-grid"><div class="field"><label>Placement Drive</label><select id="driveId" required></select></div><div class="field"><label>Target Students</label><select id="targetType" onchange="toggleInterviewTarget()"><option value="INDIVIDUAL">Individual Student</option><option value="SPECIFIC">Multiple Students</option><option value="BRANCH">Branch / Department</option><option value="RANGE">Roll Number Range</option></select></div><div id="studentField" class="field"><label>Student Roll Number</label><input id="studentRollNumber" placeholder="STU001"></div><div id="studentsField" class="field" style="display:none"><label>Student Roll Numbers (comma-separated)</label><input id="studentIds" placeholder="STU001,STU002,STU003"></div><div id="interviewBranchField" class="field" style="display:none"><label>Branch / Department</label><input id="interviewBranch" placeholder="Information Technology"></div><div id="interviewRangeField" class="form-grid" style="display:none"><div class="field"><label>From Roll Number</label><input id="interviewFrom" placeholder="STU001"></div><div class="field"><label>To Roll Number</label><input id="interviewTo" placeholder="STU010"></div></div><div class="field"><label>Round</label><input id="round" placeholder="Technical Round 1" required></div><div class="field"><label>Date</label><input id="interviewDate" type="date" required></div><div class="field"><label>Time</label><input id="interviewTime" type="time" required></div><div class="field"><label>Type</label><select id="type"><option>ONLINE</option><option>OFFLINE</option></select></div><div class="field"><label>Venue / Location</label><input id="venue" required></div><div class="field full"><label>Meeting Link</label><input id="meetingLink"></div><div class="field full"><button type="button" class="btn secondary" onclick="previewInterviewSelection()">Preview Selected Students</button></div><div class="field full"><div id="preview" class="card muted">No students selected.</div></div><div class="field full"><button class="btn">Schedule Interview</button></div></form></div><h1>Interview Schedule</h1><div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Company</th><th>Round</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody id="interviewsBody"></tbody></table></div></main><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/interviews.js"></script><script src="js/manage-interviews.js"></script><script>loadInterviewDrives();loadInterviews()</script></body></html>
