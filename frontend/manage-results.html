<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Results</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand">Manage Results</div><nav><a href="admin-dashboard.html">Dashboard</a><button class="btn danger" onclick="logout()">Logout</button></nav></header><main class="container"><div class="card form"><h2>Publish Result</h2><form onsubmit="publishResult(event)" class="form-grid"><div class="field"><label>Application ID</label><input name="applicationId" type="number" required></div><div class="field"><label>Package (LPA)</label><input name="package" type="number" step="0.1" required></div><div class="field"><label>Status</label><select name="status"><option>SELECTED</option><option>NOT_SELECTED</option></select></div><div class="field"><label>Joining Date</label><input name="joiningDate" type="date"></div><div class="field full"><button class="btn">Publish Result</button></div></form></div><h1>Published Results</h1><div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Company</th><th>Role</th><th>Package</th><th>Status</th></tr></thead><tbody id="resultsBody"></tbody></table></div></main><div id="toast" class="toast"></div><script src="js/api.js"></script><script src="js/admin.js"></script><script src="js/admin-tools.js"></script><script>loadAdminTables()</script></body></html>
